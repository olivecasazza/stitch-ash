name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # STI-433: reconcile drift between main and live.
  #
  # `on: push` fires only for pushes made by a NON-GITHUB_TOKEN credential, so
  # every squash-merge performed by .github/workflows/auto-merge.yml lands on
  # main WITHOUT a deploy run and the site silently drifts behind main. Three
  # consecutive merges (fb284c4, 371b629, 3183b9a) produced zero workflow
  # firings before this was fixed.
  #
  # `on: workflow_run` on the Auto-merge workflow was evaluated and REJECTED
  # for this repo. Evidence recorded on STI-433 (read 2026-09-27):
  #   * The Auto-merge run's `headSha` is the PRE-merge PR head (9846e063 for
  #     PR #41), not the squash merge commit (3183b9a) that the run causes to
  #     be created moments later. The merge commit does not exist at checkout
  #     time, so it cannot be checked out from the payload.
  #   * The Auto-merge run completes BEFORE the merge lands. PR #41: the
  #     Auto-merge run finished 2026-09-27T21:19:35Z; the merge happened
  #     2026-09-27T21:21:06Z — 91s later. A workflow_run deploy chained off
  #     that run would publish a pre-merge tree, then never run again.
  # `workflow_run` chains off a *push* workflow run, not off the merge itself,
  # so its payload carries no post-merge commit to deploy.
  #
  # STI-434: `on: push` does not fire for a commit created by GitHub's native
  # auto-merge, and the cron backstop added by STI-433 has never been delivered
  # by GitHub at all, so every bot-merge still left the site behind main. The
  # deterministic trigger is `pull_request: closed` below, which fires on the
  # merge event itself and carries the resulting merge commit.
  #
  # Why the obvious alternatives do not work here (evaluated on STI-434,
  # 2026-09-27, against this repo's actual event stream):
  #   * `on: push` — GitHub suppresses push events for commits its own
  #     auto-merge service creates, so bot-merges never reach this trigger.
  #   * `on: workflow_run` off Auto-merge — REJECTED on STI-433. That run's
  #     headSha is the PRE-merge PR head, and it completes BEFORE the merge
  #     lands (PR #41: run finished 21:19:35Z, merge 21:21:06Z, 91s later), so
  #     a deploy chained off it would publish a pre-merge tree.
  #   * `repository_dispatch` fired from auto-merge.yml — ALSO REJECTED on
  #     STI-434. auto-merge.yml never performs the merge; it only calls the
  #     `enablePullRequestAutoMerge` GraphQL mutation and exits. The merge is
  #     then performed asynchronously by GitHub's native auto-merge service
  #     once the required checks go green. There is therefore no workflow run
  #     that happens *at* merge time to dispatch from — a dispatch step in
  #     auto-merge.yml would fire long before the merge commit exists.
  #   * `on: schedule` — still worth keeping as a last-resort backstop, but it
  #     is not load-bearing: see below.
  #
  # Verified on STI-434 that this event IS delivered on this repo: the repo
  # event feed shows PullRequestEvent action=merged for PRs #38, #39, #40, #41,
  # #44 and #45, including the two bot-merges that produced zero deploy runs
  # (PR #40 -> 95e70fde, PR #44 -> d1adb3d). The trigger is therefore proven
  # live rather than assumed.
  pull_request:
    types: [closed]
  # The schedule is a BACKSTOP, not the primary trigger. STI-434 measured zero
  # schedule events across 80+ minutes and 8 cron boundaries after d1adb3d put
  # the */10 backstop on main, with repo/org Actions permissions, workflow
  # state, fork/archive/disabled flags and rulesets all confirmed healthy — the
  # GitHub API exposes no reason, so the cause is not attributable from here.
  # Coarsened to */30 because high-frequency crons are the ones GitHub drops
  # under load; a bounded 30-minute self-heal is strictly better than the
  # unbounded drift of a schedule that never fires at all.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

# Cancel a scheduled deploy when a newer commit lands on main mid-run: the newer
# run deploys a newer commit, so continuing the older one wastes minutes and
# risks publishing a stale build last. Manual runs are never cancelled.
#
# STI-434: the group is keyed on the DEPLOY TARGET, not on github.ref_name.
# A `pull_request` event has ref_name like "40/merge", so keying on ref_name
# would give merge-triggered deploys their own group that a cron deploy on
# `main` would not cancel — the two could then race and publish out of order.
# Every deploy this workflow performs targets main, so the group is a constant.
concurrency:
  group: deploy-main
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: fresh-check
    # Scheduled runs defer to the freshness gate; push, merge and manual runs
    # always deploy, so an explicit `gh workflow run deploy.yml --ref main`
    # stays a faithful rebuild of that ref. `always()` is required because
    # fresh-check is skipped for non-schedule events, and a skipped `needs` job
    # would otherwise skip this one and silently disable every manual redeploy.
    #
    # The pull_request clause drops closes that were not merges: GitHub
    # delivers `closed` for abandoned PRs too, and main has not moved, so there
    # is nothing to publish and the run would fail in every later step for lack
    # of a checkout. This is a whole-job guard rather than a step guard on
    # purpose — a skipped checkout with unguarded build steps fails the run.
    if: >-
      ${{ always()
          && (github.event_name != 'schedule' || needs.fresh-check.outputs.needed == 'true')
          && (github.event_name != 'pull_request' || github.event.pull_request.merged) }}
    permissions:
      contents: read
      deployments: write
    # STI-434: on a `pull_request` event github.ref_name is "<pr>/merge" (e.g.
    # "40/merge"), which is neither a branch nor a ref that can be checked out
    # or published. The merge commit itself is only reachable via the base
    # branch, so resolve the deploy target once and use it for the checkout and
    # the Cloudflare branch alike.
    env:
      DEPLOY_REF: ${{ github.event_name == 'pull_request' && 'main' || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
        run: pnpm build

      # STI-241: cloudflare/pages-action was deleted upstream (repo now 404),
      # breaking deploys with "Unable to resolve action `cloudflare/pages-action`".
      # Publish via wrangler-action + `wrangler pages deploy` instead — same
      # artifact (nuxt cloudflare_pages preset emits dist/ with _worker.js).
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: pages deploy dist --project-name=stitch-ash-web --branch=${{ env.DEPLOY_REF }} --commit-dirty=true

  # STI-433: skip a scheduled deploy when main is already live. Without this the
  # cron rebuilds and republishes an identical artifact every 10 minutes,
  # burning Actions minutes and churning Cloudflare deployments for no change.
  # Push and manual deploys are never skipped, so an explicit redeploy always
  # rebuilds and republishes.
  #
  # "Already live" == the head SHA of the most recent SUCCESSFUL run of this
  # workflow on main equals main's current head. Any error reading that history
  # (first run after this change lands, API blip, missing permission) fails
  # OPEN and deploys, so the gate can never be the reason the site stays stale.
  fresh-check:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Compare main against last successful deploy
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          head_sha="$(git ls-remote "https://github.com/${REPO}.git" refs/heads/main | cut -f1)"
          echo "main head: ${head_sha}"

          last_sha="$(gh api -X GET "repos/${REPO}/actions/workflows/deploy.yml/runs" \
            -f status=success -f per_page=100 \
            --jq '[.workflow_runs[] | select(.head_branch == "main") | .head_sha] | .[0] // empty' 2>&1)" || last_sha=""

          if [ -z "${last_sha}" ]; then
            echo "Could not read a prior successful deploy of main — failing OPEN and deploying."
            echo "needed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "last successful deploy head: ${last_sha}"
          if [ "${last_sha}" = "${head_sha}" ]; then
            echo "main is already live — nothing to deploy."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved since the last successful deploy — deploying."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
