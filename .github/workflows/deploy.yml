name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # Manual re-deploy of main. Also needed because GITHUB_TOKEN (auto-merge)
  # pushes do not trigger `on: push`, so bot-merged PRs never auto-deploy.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
        run: pnpm build

      # STI-241: cloudflare/pages-action was deleted upstream (repo now 404),
      # breaking deploys with "Unable to resolve action `cloudflare/pages-action`".
      # Publish via wrangler-action + `wrangler pages deploy` instead — same
      # artifact (nuxt cloudflare_pages preset emits dist/ with _worker.js).
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: pages deploy dist --project-name=stitch-ash-web --branch=${{ github.ref_name }} --commit-dirty=true
