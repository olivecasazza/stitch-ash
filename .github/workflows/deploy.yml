name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # STI-433: reconcile drift between main and live.
  #
  # `on: push` fires only for pushes made by a NON-GITHUB_TOKEN credential, so
  # every squash-merge performed by .github/workflows/auto-merge.yml lands on
  # main WITHOUT a deploy run and the site silently drifts behind main. Three
  # consecutive merges (fb284c4, 371b629, 3183b9a) produced zero workflow
  # firings before this was fixed.
  #
  # `on: workflow_run` on the Auto-merge workflow was evaluated and REJECTED
  # for this repo. Evidence recorded on STI-433 (read 2026-09-27):
  #   * The Auto-merge run's `headSha` is the PRE-merge PR head (9846e063 for
  #     PR #41), not the squash merge commit (3183b9a) that the run causes to
  #     be created moments later. The merge commit does not exist at checkout
  #     time, so it cannot be checked out from the payload.
  #   * The Auto-merge run completes BEFORE the merge lands. PR #41: the
  #     Auto-merge run finished 2026-09-27T21:19:35Z; the merge happened
  #     2026-09-27T21:21:06Z — 91s later. A workflow_run deploy chained off
  #     that run would publish a pre-merge tree, then never run again.
  # `workflow_run` chains off a *push* workflow run, not off the merge itself,
  # so its payload carries no post-merge commit to deploy.
  #
  # STI-434: `on: push` does not fire for a commit created by GitHub's native
  # auto-merge, and the cron backstop added by STI-433 has never been delivered
  # by GitHub at all, so every bot-merge still left the site behind main.
  # `pull_request: closed` below was the attempted replacement.
  #
  # WARNING — the `pull_request: closed` trigger is PROVEN INSUFFICIENT and
  # must not be read as covering bot-merges. PR #51 is the counter-example,
  # measured live and recorded in docs/STI-434-trigger-proof.md:
  #
  #   $ gh pr view 51 --json mergedAt,mergedBy,mergeCommit,headRefOid
  #   mergedAt=2026-09-27T23:49:51Z
  #   mergedBy={"login":"app/github-actions","is_bot":true}
  #   mergeCommit=9e7083ea724d8c3c8a5953af7aff183638656d8d
  #   $ gh api "repos/olivecasazza/stitch-ash/actions/runs?head_sha=9e7083ea..." -q .total_count
  #   0
  #
  # PR #51 is a real ancestor of main, merged 29 minutes AFTER this trigger
  # reached main (23:20:36Z), and it produced ZERO runs — not a deploy, not
  # Release-plz, not any other workflow. The four `pull_request` runs that do
  # exist for its branch all carry the pre-merge head `ac4d24dc` and were
  # created 98s BEFORE the merge.
  #
  # The controlled comparison is exact. Every merge since this trigger landed:
  #   PR #48 23:20:34 PAT  -> push 36358367571 + pull_request 36358368384
  #   PR #49 23:27:14 PAT  -> push 36358742010 + pull_request 36358742266
  #   PR #50 23:35:11 PAT  -> push 36359195253 + pull_request 36359195453
  #   PR #51 23:49:51 BOT  -> NOTHING
  #   PR #53 23:55:37 PAT  -> push 36360315984 + pull_request 36360315906
  #   PR #55 00:22:11 PAT  -> push 36361968799 + pull_request 36361969147
  # Five PAT merges, five merge-triggered deploys. One bot-merge, zero runs.
  #
  # Cause: GitHub suppresses ALL workflow events originating from a
  # GITHUB_TOKEN actor, not just `push`. Enabling auto-merge with
  # GITHUB_TOKEN in auto-merge.yml makes the native auto-merge service
  # merge as the Actions app, and the resulting `pull_request: closed` event
  # is suppressed along with it. This trigger is therefore load-bearing for
  # PAT merges only, which is a real improvement over push-only, but it does
  # NOT close the bot-merge gap and the site can still drift on a bot-merge.
  #
  # Status of the alternatives (evaluated on STI-434, 2026-09-27):
  #   * `on: push` — suppressed for a GITHUB_TOKEN merge. (STI-433)
  #   * `on: workflow_run` off Auto-merge — REJECTED on STI-433. That run's
  #     headSha is the PRE-merge PR head, and it completes BEFORE the merge
  #     lands (PR #41: run finished 21:19:35Z, merge 21:21:06Z, 91s later), so
  #     a deploy chained off it would publish a pre-merge tree.
  #   * `on: pull_request: closed` — SUPPRESSED for a GITHUB_TOKEN merge. (PR
  #     #51, above.) Kept below because it does work for PAT merges, but it is
  #     not a bot-merge fix.
  #   * `on: schedule` — 2 firings, both successful DEPLOYS of a bot-merge,
  #     measured 2026-09-28T08:53Z: 01:55:20Z (run 36367814346, head 7e3c263)
  #     and 08:31:30Z (run 36397871109, head fb5fe11). STI-469 corrected the
  #     "0 firings, all time" claim this line used to carry, which was wrong on
  #     both counts: the cron is only ~11h old, and it has fired.
  #
  #     The 08:31:30Z firing is the one that settles the question. It deployed
  #     fb5fe11, which PR #72 merged at 08:31:19Z — ELEVEN SECONDS earlier, by
  #     app/github-actions. `fb5fe11` has no workflow_dispatch run at all; the
  #     only two runs carrying that head are this schedule run and the
  #     Auto-merge workflow_run. Between 08:20Z and 08:50Z the sole deploy runs
  #     are this cron and a later hand-dispatch of a different SHA (b8bd6f2).
  #     So an unattended GITHUB_TOKEN merge was picked up and published with no
  #     human or agent dispatching anything. The backstop is load-bearing for
  #     exactly the case it was added for.
  #
  #     What remains unproven is DELIVERY reliability, not function: 2 observed
  #     firings against ~20 expected on the */30 cadence. A cron that finds
  #     nothing to do does still leave a run in history (`fresh-check` skips the
  #     deploy, the run does not disappear), so absent runs are a real signal
  #     here — but the sample is too small to attribute a cause, and the
  #     GitHub API exposes none. Best-effort self-heal, not a guarantee.
  #   * `repository_dispatch` — THE FIX, and it needs no new secret. GitHub
  #     documents the recursion guard as: "With the exception of
  #     `workflow_dispatch` and `repository_dispatch`, other
  #     GITHUB_TOKEN-triggered events do not create workflow runs at all."
  #     (docs.github.com, "Events that trigger workflows" -> `pull_request`.)
  #     So the ONE credential change STI-433 asked for (a PAT) is not required
  #     to close the bot-merge gap: `GITHUB_TOKEN` can dispatch directly.
  #
  #     STI-433 implemented it on 2026-10-01. auto-merge.yml now waits for the
  #     merge commit to actually exist (bounded), then dispatches this event
  #     carrying that SHA. Unlike `workflow_run` (rejected above because the
  #     payload carries no post-merge commit and the run completes too early),
  #     the SHA is read from the API after the merge lands, so it is the real
  #     post-merge commit every time.
  #
  #     `client_payload.sha` is authoritative when present. The job refetches
  #     main and falls back to it when absent, so a dispatch written by an older
  #     auto-merge.yml still deploys the right thing rather than nothing.
  repository_dispatch:
    types: [deploy-main]
  pull_request:
    types: [closed]
  # The schedule is a BACKSTOP, not the primary trigger. STI-434 measured zero
  # schedule events across 80+ minutes and 8 cron boundaries after d1adb3d put
  # the */10 backstop on main, with repo/org Actions permissions, workflow
  # state, fork/archive/disabled flags and rulesets all confirmed healthy — the
  # GitHub API exposes no reason, so the cause is not attributable from here.
  # Coarsened to */30 because high-frequency crons are the ones GitHub drops
  # under load; a bounded 30-minute self-heal is strictly better than the
  # unbounded drift of a schedule that never fires at all.
  #
  # STI-469: the "never fires at all" in the line above is not supported by the
  # record. Two firings have been observed, 2026-09-28T01:55:20Z (run
  # 36367814346) and 2026-09-28T08:31:30Z (run 36397871109), and the second
  # one deployed a bot-merge unattended — see the trigger list above. What is
  # still unproven is the delivery rate, not the mechanism. See
  # docs/STI-469-trigger-audit.md §2.
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

# Cancel a scheduled deploy when a newer commit lands on main mid-run: the newer
# run deploys a newer commit, so continuing the older one wastes minutes and
# risks publishing a stale build last. Manual runs are never cancelled.
#
# STI-434: the group is keyed on the DEPLOY TARGET, not on github.ref_name.
# A `pull_request` event has ref_name like "40/merge", so keying on ref_name
# would give merge-triggered deploys their own group that a cron deploy on
# `main` would not cancel — the two could then race and publish out of order.
# Every deploy this workflow performs targets main, so the group is a constant.
concurrency:
  group: deploy-main
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: fresh-check
    # Scheduled runs defer to the freshness gate; push, merge and manual runs
    # always deploy, so an explicit `gh workflow run deploy.yml --ref main`
    # stays a faithful rebuild of that ref. `always()` is required because
    # fresh-check is skipped for non-schedule events, and a skipped `needs` job
    # would otherwise skip this one and silently disable every manual redeploy.
    #
    # The pull_request clause drops closes that were not merges: GitHub
    # delivers `closed` for abandoned PRs too, and main has not moved, so there
    # is nothing to publish and the run would fail in every later step for lack
    # of a checkout. This is a whole-job guard rather than a step guard on
    # purpose — a skipped checkout with unguarded build steps fails the run.
    if: >-
      ${{ always()
          && (github.event_name != 'schedule' || needs.fresh-check.outputs.needed == 'true')
          && (github.event_name != 'pull_request' || github.event.pull_request.merged) }}
    permissions:
      contents: read
      deployments: write
    # STI-434: on a `pull_request` event github.ref_name is "<pr>/merge" (e.g.
    # "40/merge"), which is neither a branch nor a ref that can be checked out
    # or published. The merge commit itself is only reachable via the base
    # branch, so resolve the deploy target once and use it for the checkout and
    # the Cloudflare branch alike.
    #
    # STI-433: a repository_dispatch run has no meaningful github.ref_name —
    # the dispatch carries the commit in client_payload. Deploy THAT commit, not
    # "whatever main points at now": the payload is the only thing that
    # distinguishes the post-merge commit from a later one, and publishing a
    # commit the dispatcher did not ask for is the failure mode this whole issue
    # is about. The empty-string arm is the guard — a dispatch with no payload
    # SHA falls back to main rather than checking out "".
    env:
      DEPLOY_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}
      DEPLOY_REF: ${{ github.event_name == 'pull_request' && 'main'
                    || (github.event_name == 'repository_dispatch' && (github.event.client_payload.sha || 'main'))
                    || github.ref_name }}
      # STI-433: what gets CHECKED OUT and what Cloudflare calls the production
      # branch are different questions. Every path here publishes to the Pages
      # production branch named `main`; only the checkout varies. Reusing
      # DEPLOY_REF for --branch would publish a dispatch to a branch literally
      # named after a 40-char SHA, which Cloudflare treats as a preview branch:
      # the deploy would report success and the site would not change at all.
      PAGES_BRANCH: main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
        run: pnpm build

      # STI-415: this is the only placement that stops a non-zero border-radius
      # from reaching Cloudflare. Until now deploy.yml built and published with
      # zero verification in between, which is how five non-zero radius literals
      # shipped live. pr-checks.yml also runs this gate, but a gate that only
      # exists on a PR cannot protect the artifact a deploy publishes.
      - name: Built-CSS radius gate
        run: ./scripts/ci/built-css-radius-gate.sh --strict-ratchet

      # STI-241: cloudflare/pages-action was deleted upstream (repo now 404),
      # breaking deploys with "Unable to resolve action `cloudflare/pages-action`".
      # Publish via wrangler-action + `wrangler pages deploy` instead — same
      # artifact (nuxt cloudflare_pages preset emits dist/ with _worker.js).
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '3'
          command: pages deploy dist --project-name=stitch-ash-web --branch=${{ env.PAGES_BRANCH }} --commit-dirty=true

  # STI-433: skip a scheduled deploy when main is already live. Without this the
  # cron rebuilds and republishes an identical artifact every 10 minutes,
  # burning Actions minutes and churning Cloudflare deployments for no change.
  # Push and manual deploys are never skipped, so an explicit redeploy always
  # rebuilds and republishes.
  #
  # "Already live" == SOME successful run of this workflow carried main's current
  # head AND its `deploy` job actually concluded `success`. Any error reading
  # that history (first run after this change lands, API blip, missing
  # permission, unreadable jobs payload) fails OPEN and deploys, so the gate can
  # never be the reason the site stays stale.
  #
  # STI-601: the second half of that sentence — the `deploy` JOB conclusion —
  # is the fix, and it is load-bearing. The predicate used to read run-level
  # `conclusion` only, and a run whose `deploy` job was SKIPPED still reports run
  # conclusion `success`. So one green no-op satisfied the predicate forever and
  # every later firing cited that no-op in turn: the backstop could stop healing
  # drift while staying green indefinitely. Measured 2026-10-01, run 36803396902
  # (`fresh-check: success`, `deploy: skipped`, run `success`) which found nothing
  # to do by citing run 36785970511 — itself `deploy: skipped`. Evidence and the
  # full before/after in docs/STI-601-freshness-gate.md.
  #
  # The predicate lives in scripts/ci/deploy-freshness-gate.sh rather than inline
  # here because it is now load-bearing enough to deserve a test, and
  # deploy-freshness-gate.test.sh runs offline in under a second. That test goes
  # red against the pre-STI-601 predicate (12 of 15 assertions fail), which is
  # the only evidence that it is testing the right thing. pr-checks.yml runs it
  # on every PR, so a future edit to the predicate cannot silently regress.
  #
  # STI-434: this job used to be gated `if: github.event_name == 'schedule'`.
  # Because GitHub had delivered no schedule event to this repo at the time
  # (verified through the raw API rather than the `gh run list --event`
  # filter), that gate made the job permanently unreachable: it reported
  # `skipped` on every run and its "fails open, so it can never be the reason
  # the site stays stale" property was never once exercised.
  #
  # STI-469: that measurement is corrected in one place. Two schedule events
  # HAVE been delivered, 2026-09-28T01:55:20Z (run 36367814346) and
  # 2026-09-28T08:31:30Z (run 36397871109), and both reached this job. The
  # second is the important one: it ran `needed=true` and deployed a bot-merge
  # that no dispatch had requested, which is the first time this gate's
  # "fails open" property was exercised on a real unattended merge.
  #
  # It now runs on EVERY event that can deploy, so the drift signal is actually
  # observed and logged rather than being dead code. This is deliberately
  # observation-only: the `deploy` job still consults `needed` only on the
  # schedule path, so a push, a merge and a manual `gh workflow run` remain
  # unconditional rebuilds of main. The check can report drift; it cannot stop
  # a deploy.
  fresh-check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    permissions:
      contents: read
      actions: read
    steps:
      # STI-601: the predicate now lives in the repo so it can be tested. A
      # `continue-on-error` checkout means a checkout failure cannot strand the
      # run: the step below then finds no script and fails OPEN.
      - name: Checkout freshness gate
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: true

      - name: Compare main against last real deploy
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ -f ./scripts/ci/deploy-freshness-gate.sh ]; then
            ./scripts/ci/deploy-freshness-gate.sh \
              --repo "${{ github.repository }}" \
              --github-output "$GITHUB_OUTPUT" || true
          else
            echo "Freshness gate script is unavailable — failing OPEN and deploying."
          fi
          # Belt and braces. The script writes `needed` on every path including
          # its own failures, but if it is missing, unparseable, or a future edit
          # exits before writing one, `needed` must still default to `true`. An
          # empty `needed` on a schedule event reads as "not needed" to the `if`
          # on the deploy job, which is the exact silent-drift failure STI-601
          # is filed about — never let a missing output become a green no-op.
          if ! grep -q '^needed=' "$GITHUB_OUTPUT"; then
            echo "No verdict was produced by the freshness gate — defaulting to deploy."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
