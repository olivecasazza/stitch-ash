name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # Manual re-deploy of main. Also needed because GITHUB_TOKEN (auto-merge)
  # pushes do not trigger `on: push`, so bot-merged PRs never auto-deploy.
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
        run: pnpm build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'stitch-ash-web'
          # nuxt.config.ts sets `nitro.preset: 'cloudflare_pages'`, so the Nuxt
          # build emits the Pages artifact to `dist/` (NOT `.output/public/`,
          # which is the default node-server preset). The wrangler.toml
          # `pages_build_output_dir = ".output/public"` is stale and harmless —
          # the Pages project uses the value the GitHub integration sends at
          # deploy time. Update wrangler.toml in a follow-up to keep local
          # `wrangler pages dev` consistent.
          directory: 'dist'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          wranglerVersion: '3'
