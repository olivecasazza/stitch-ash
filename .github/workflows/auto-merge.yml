name: Auto-merge

on:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened, ready_for_review]
  # STI-441: re-arm after the labeler finishes.
  #
  # `pull_request` (opened/synchronize) fires this workflow and semver-label.yml
  # from the same event, so on a fresh PR head BOTH start at the same second and
  # auto-merge reads the PR before semver-label has written the label. Measured
  # on PR #59 (head 206180bc, 2026-09-28T04:04:01Z): auto-merge run 36376144858
  # logged `Labels [] do not qualify for auto-merge.` and concluded SUCCESS, so
  # the skip is invisible in the checks list and the PR never merges. The
  # `labeled` trigger below cannot cover that case, because GITHUB_TOKEN-created
  # events do not retrigger workflows.
  #
  # workflow_run off semver-label is the deterministic re-arm: it is delivered
  # after the label has been written, and it also lands for the GITHUB_TOKEN
  # label write that `pull_request: labeled` misses. Guarded on conclusion ==
  # success so a failed label run cannot arm auto-merge off a stale label.
  workflow_run:
    workflows: [Semver Label]
    types: [completed]
  check_suite:
    types: [completed]
  status: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Skip the bootstrap PR entirely — it introduced this workflow and cannot dogfood it.
    if: ${{ !contains(github.event.pull_request.title, 'BOOTSTRAP') }}
    permissions:
      contents: write
      pull-requests: write
      # STI-433: no extra scope is declared for the dispatch below, and that is
      # deliberate. There is no "repository-dispatch" permission — actionlint
      # rejects it, and GitHub rejects an unrecognised key inside `permissions`
      # outright, which would make THIS ENTIRE WORKFLOW invalid and stop every
      # PR from auto-merging. Worse than the bug being fixed. The dispatch is
      # created with the same GITHUB_TOKEN as the merge, and any failure is
      # caught and degraded to the */30 cron backstop rather than thrown.
      #
      # STI-620: `contents: write` above is also what lets the dedup gate write
      # its compare-and-swap ref, so the dedup needs NO permission this workflow
      # does not already hold. `actions: read` is deliberately NOT added: the
      # gate does not read run history (that alternative is racy — see
      # scripts/ci/deploy-dispatch-dedup.sh) and adding a scope for a read it
      # never performs would be an invitation to reintroduce it.
    steps:
      # STI-620: the dispatch dedup gate lives in scripts/ci rather than inline
      # in the github-script block, because it is load-bearing and an untested
      # guard in the path that publishes the site is how STI-601 happened.
      # `continue-on-error` for the same reason the checkout in deploy.yml's
      # fresh-check has it: a checkout failure must not strand this run. If the
      # script is absent the step below fails OPEN and dispatches, exactly as
      # this job behaved before STI-620 — redundant deploy, never a stale site.
      - name: Checkout dispatch dedup gate
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          sparse-checkout-cone-mode: true

      - name: Arm auto-merge, then dispatch the merge commit for deploy
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // STI-441: `label` is the ONLY semver value that authorizes a merge.
            // A PR carrying no semver label is not "not yet eligible", it is
            // "semver-label has not finished writing yet", and those two states
            // are indistinguishable at a single instant — which is exactly the
            // bug. Everything below waits for the real state instead of guessing.
            const autoMergeLabels = ['semver:patch', 'semver:minor'];
            const blockLabels     = ['semver:major', 'semver:unknown'];

            // Bounded wait for semver-label to land. 90s is ~45x the 2s skew
            // measured on PR #59, so it absorbs the race with room to spare while
            // staying well inside the job timeout. Polling is by API read, not a
            // blind sleep, so a PR that already carries its label returns on the
            // first iteration and costs nothing.
            const labelWait  = 90 * 1000;
            const interval   = 5 * 1000;
            const labelUntil = Date.now() + labelWait;

            // Resolve the PR number — available directly on pull_request events;
            // workflow_run, check_suite and status events need a lookup.
            let prNumber = context.payload.pull_request?.number;

            const findPrBySha = async sha => {
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, state: 'open', per_page: 100,
              });
              return prs.find(p => p.head.sha === sha);
            };

            if (!prNumber && context.eventName === 'workflow_run') {
              // The Semver Label run that just completed. `pull_requests` is
              // populated for pull_request-triggered runs; fall back to a
              // head-SHA lookup because it is documented as best-effort.
              const prs = context.payload.workflow_run?.pull_requests || [];
              if (prs.length) {
                prNumber = prs[0].number;
              } else if (context.payload.workflow_run?.head_sha) {
                const match = await findPrBySha(context.payload.workflow_run.head_sha);
                if (!match) {
                  core.info('Semver Label ran for a SHA with no open PR — nothing to arm.');
                  return;
                }
                prNumber = match.number;
              }
            }

            if (!prNumber && context.eventName === 'status') {
              const match = await findPrBySha(context.payload.sha);
              if (!match) { core.info('No open PR for this SHA — skipping.'); return; }
              prNumber = match.number;
            }

            if (!prNumber && context.eventName === 'check_suite') {
              const prs = context.payload.check_suite?.pull_requests || [];
              if (!prs.length) { core.info('No PRs attached to check suite — skipping.'); return; }
              prNumber = prs[0].number;
            }

            if (!prNumber) { core.info('Could not determine PR number — skipping.'); return; }

            // Fetch the PR
            let { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });

            // Hard stop: bootstrap PR guard by title
            if (pr.title.includes('BOOTSTRAP')) {
              core.info('Bootstrap PR detected — skipping auto-merge.');
              return;
            }

            // Must not be a draft
            if (pr.draft) {
              core.info('PR is a draft — skipping auto-merge.');
              return;
            }

            // Must not have do-not-merge label
            const hasDoNotMerge = () =>
              pr.labels.map(l => l.name).includes('do-not-merge');

            if (hasDoNotMerge()) {
              core.info('do-not-merge label present — skipping auto-merge.');
              return;
            }

            // Wait for semver-label to publish, but only while no semver label
            // exists at all. A `semver:major` / `semver:unknown` label is a
            // settled decision to NOT auto-merge, so waiting on it would burn
            // 90s on every correctly-blocked PR.
            const hasSemverLabel = () =>
              pr.labels.map(l => l.name).some(n => n.startsWith('semver:'));

            if (!hasSemverLabel()) {
              core.info('No semver label yet — waiting for semver-label to land…');
              while (Date.now() < labelUntil) {
                await new Promise(r => setTimeout(r, interval));
                ({ data: pr } = await github.rest.pulls.get({
                  owner, repo, pull_number: prNumber,
                }));
                if (hasDoNotMerge()) {
                  core.info('do-not-merge applied while waiting — skipping auto-merge.');
                  return;
                }
                if (hasSemverLabel()) {
                  core.info(`Semver label landed: ${pr.labels.map(l => l.name).join(', ')}`);
                  break;
                }
                core.info(`Still unlabelled — retrying in ${interval / 1000}s…`);
              }
            }

            // Must have patch or minor semver label (not major or unknown)
            const labels = pr.labels.map(l => l.name);

            const hasAutoLabel  = labels.some(l => autoMergeLabels.includes(l));
            const hasBlockLabel = labels.some(l => blockLabels.includes(l));

            if (hasBlockLabel || !hasAutoLabel) {
              core.info(
                `Labels ${JSON.stringify(labels)} do not qualify for auto-merge. ` +
                (hasSemverLabel()
                  ? 'This is a settled decision (major/unknown), not a race.'
                  : 'No semver label after waiting — semver-label has not published for this PR.')
              );
              return;
            }

            // Enable GitHub native auto-merge (squash)
            // This is idempotent — calling it when already enabled is fine.
            let armed = false;
            try {
              await github.graphql(`
                mutation EnableAutoMerge($prId: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $prId, mergeMethod: SQUASH }) {
                    pullRequest { autoMergeRequest { enabledAt } }
                  }
                }
              `, { prId: pr.node_id });
              armed = true;
              core.info(`Auto-merge (squash) enabled on PR #${prNumber}.`);
            } catch (err) {
              // Enabling can legitimately fail while required checks are still
              // reporting, because GitHub refuses the mutation until the merge
              // queue's requirements are satisfiable. That is not fatal: the
              // next check_suite/status/synchronize event, or the Semver Label
              // workflow_run above, re-enters this job and the call is idempotent.
              core.warning(`enablePullRequestAutoMerge: ${err.message}`);
            }

            // STI-433: dispatch the merge commit so it deploys.
            //
            // Auto-merge does NOT merge the instant it is enabled. The required
            // checks are still reporting at this moment, so the merge happens
            // some time after this job finishes — which is exactly why the
            // rejected `workflow_run` chain (see deploy.yml) could not work:
            // it fires on THIS run completing, before the merge commit exists.
            //
            // So wait for the merge to actually land, then tell deploy.yml which
            // commit to publish. This needs no new secret: GitHub documents
            // "With the exception of workflow_dispatch and repository_dispatch,
            // other GITHUB_TOKEN-triggered events do not create workflow runs at
            // all", so GITHUB_TOKEN can dispatch this itself.
            //
            // Bounds, because a job that waits forever is worse than no fix:
            //   * mergeWait  — hard ceiling on the wait (5 min).
            //   * backstop   — this is belt-and-braces with deploy.yml's */30
            //                  cron, so a miss here costs at most one cron
            //                  window, not a stuck site.
            // A PR that is never merged simply times out and returns cleanly.
            const mergeWait  = 5 * 60 * 1000;
            const mergeStep  = 10 * 1000;
            const mergeUntil = Date.now() + mergeWait;

            const readMergedSha = async () => {
              const { data: latest } = await github.rest.pulls.get({
                owner, repo, pull_number: prNumber,
              });
              if (!latest.merged || !latest.merge_commit_sha) return null;
              // merge_commit_sha can name a commit not yet reachable from the
              // base branch; confirm it exists before handing it to a deploy.
              try {
                await github.rest.repos.getCommit({
                  owner, repo, ref: latest.merge_commit_sha,
                });
              } catch {
                return null;
              }
              return latest.merge_commit_sha;
            };

            // STI-620: suppress the duplicate dispatches.
            //
            // This job re-enters many times per PR (pull_request, the Semver
            // Label workflow_run, check_suite and status events), and every
            // re-entry that lands AFTER the merge takes the fast path below,
            // which used to dispatch unconditionally. readMergedSha is
            // deterministic, so every one of those invocations sent the SAME
            // deploy-main event for the SAME commit and deploy.yml rebuilt and
            // republished it each time — 25 dispatch runs for 12 merges,
            // measured 2026-10-02. PR #179 is the sharpest case: runs
            // 36985017627 (08:36:39Z) and 36985020457 (08:36:41Z), two seconds
            // apart, both `success`, both publishing e06f26a2.
            //
            // The gate is a compare-and-swap on a git ref rather than a read of
            // deploy.yml's run history, and the reason is that 2-second gap:
            // two invocations starting 2s apart can both observe "no run for
            // this SHA yet" and both dispatch, so a history check would make
            // the duplicate count a coin flip rather than 1. Creating
            // refs/sti/deploy-dispatched/<sha> either succeeds (201, nobody has
            // dispatched this commit — dispatch) or fails with 422 (someone
            // already did — skip). There is no read-then-write window, so
            // simultaneity is safe and ordering is irrelevant.
            //
            // It fails OPEN everywhere: no script, no token, an unreadable API
            // and a 403 all answer "dispatch". A missed merge is healed by
            // deploy.yml's */30 cron within one window; a redundant deploy
            // costs minutes. This job never becomes the reason a merge does not
            // reach the site.
            const dispatchDeploy = async sha => {
              const gate = 'scripts/ci/deploy-dispatch-dedup.sh';
              let dispatch = true;
              try {
                const { spawnSync } = await import('node:child_process');
                const res = spawnSync(
                  './' + gate,
                  ['--sha', sha, '--repo', `${owner}/${repo}`],
                  { encoding: 'utf8' }
                );
                const verdict = `${res.stdout || ''}`.split('\n').find(l => l.startsWith('dispatch='));
                if (res.status !== 0 || !verdict) {
                  // Fail OPEN, loudly. A gate that cannot be read must not read
                  // as "already dispatched" — that would turn a broken
                  // checkout into a permanently silent deploy gap.
                  core.warning(
                    `dispatch dedup gate unusable (exit ${res.status}, no verdict). ` +
                    `Failing OPEN — dispatching ${sha}. ` +
                    `${(res.stderr || '').trim().slice(0, 400)}`
                  );
                } else {
                  dispatch = verdict.trim() === 'dispatch=true';
                  core.info(`${verdict.trim()} — ${res.stdout.trim().split('\n').slice(-2).join(' | ')}`);
                }
              } catch (err) {
                core.warning(`dispatch dedup gate threw: ${err.message}. Failing OPEN — dispatching ${sha}.`);
              }

              if (!dispatch) {
                core.info(`Merge commit ${sha} was already dispatched by an earlier invocation — not dispatching again.`);
                return;
              }

              try {
                await github.rest.repos.createDispatchEvent({
                  owner, repo,
                  event_type: 'deploy-main',
                  client_payload: {
                    sha,
                    pr: String(prNumber),
                    source: 'auto-merge',
                  },
                });
                core.info(`Dispatched deploy-main for ${sha}.`);
              } catch (err) {
                // Not fatal: the */30 cron in deploy.yml still reconciles drift,
                // so a dispatch failure degrades to the pre-existing backstop
                // rather than failing this run and masking the merge.
                //
                // STI-620: the ref is already written at this point, so if this
                // dispatch fails the next re-entry will skip and the cron is the
                // only thing that heals it. That is the intended trade — the
                // dedup must claim BEFORE dispatching or two invocations would
                // both see an unclaimed ref and both dispatch, which is the
                // duplicate this change exists to remove.
                core.warning(`createDispatchEvent: ${err.message}`);
              }
            };

            // This job re-enters on every check_suite/status/synchronize event
            // and on the Semver Label workflow_run, so this block runs many
            // times per PR. Most of those invocations are AFTER the merge, and
            // waiting 5 minutes on each would burn a lot of CI time to
            // rediscover a fact already true. Check the answer first and only
            // wait when the merge genuinely has not happened yet.
            //
            // Both exits below route through dispatchDeploy, so the STI-620
            // dedup covers the fast path and the wait path with one guard.
            const alreadyMergedSha = await readMergedSha();
            if (alreadyMergedSha) {
              core.info(`PR #${prNumber} already merged as ${alreadyMergedSha} — offering the dispatch to the dedup gate.`);
              await dispatchDeploy(alreadyMergedSha);
              return;
            }

            core.info('Auto-merge armed; waiting for the merge to land…');
            let mergeSha = null;
            while (Date.now() < mergeUntil) {
              await new Promise(r => setTimeout(r, mergeStep));
              mergeSha = await readMergedSha();
              if (mergeSha) break;
            }

            if (!mergeSha) {
              core.info('PR did not merge within the wait — deploy.yml cron backstop will catch it.');
              return;
            }

            core.info(`PR #${prNumber} merged as ${mergeSha} — dispatching deploy.`);
            await dispatchDeploy(mergeSha);

