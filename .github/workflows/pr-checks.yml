name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # STI-395: @nuxtjs/shopify generates the StorefrontAPI codegen types
        # (IMAGE_FRAGMENT, useStorefrontData, #shopify/storefront, ...) during
        # `nuxt prepare`. It skips setup entirely when the storefront token is
        # absent — "[shopify] Skipping setup: config not provided or invalid" —
        # so the types are never written and every consumer of them fails
        # typecheck. The Build step below already receives this token; the
        # typecheck step did not, which is why this check has been red for
        # every storefront PR since PR #33.
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
        run: pnpm typecheck

      # STI-432: `catalog:plan` reported 5 phantom `update variant` actions
      # because the diff resolved remote option values by the hardcoded name
      # "Option1"/"Title" and missed the `Size` option on sku-001. A false plan
      # is exactly what the operator approval gate exists to catch, so the diff
      # itself is now under test. Pure unit test, no store credentials needed.
      - name: Catalog diff tests
        run: pnpm catalog:test

      - name: Build
        run: pnpm build

  # STI-538: product status is declared twice — catalog/products/*.yaml says
  # ACTIVE, nixlab nix/tofu/shopify/terranix.nix says "draft". The live store is
  # ACTIVE on all three SKUs, and the terranix resources use update_method=PUT,
  # so `nix run .#deploy-shopify` would de-list all three in one apply. The two
  # files live in different repos, so nothing points an editor at the conflict.
  # This gate makes it visible; see docs/decisions/2026-09-28-catalog-source-of-truth.md
  # for the single-owner decision. No store credentials are read here.
  catalog-status-ownership-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # STI-557: the gate compares status AND inventory_policy. The first
      # version compared status only, so the cheapest operator edit — terranix
      # status "draft" -> "active" — turned it green while
      # `inventory_policy = "deny"` stood in the same block. On the live store
      # that would block checkout on all 7 variants, every one of which is at
      # or below zero inventory. This suite pins that exact fixture so the
      # false green cannot come back, and pins that a missing nixlab tree is
      # reported SKIPPED rather than passed. Needs no Node and no secrets.
      #
      # STI-569: the suite used to point at an agent-host nixlab path that does
      # not exist on a runner, so this job was red on every PR and the red
      # meant nothing. The conflicting terranix is now checked in at
      # scripts/ci/fixtures/catalog-status-ownership/nixlab/, so the assertion
      # is reproducible on a fresh clone.
      - name: Test catalog status ownership gate
        run: ./scripts/ci/catalog-status-ownership-gate.test.sh

      # This step alone is still cross-repo blind on a runner: it checks out
      # only this repo, finds no nixlab tree, reports SKIPPED and exits 0.
      # Closing that needs a second checkout — tracked as STI-531/STI-561,
      # deliberately not folded into STI-569.
      - name: Run catalog status ownership gate
        run: ./scripts/ci/catalog-status-ownership-gate.sh

  internal-copy-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run internal-copy gate
        run: ./scripts/ci/no-internal-copy-in-storefront.sh

  # STI-446: 30 custom properties sat in tokens.css with no DESIGN.md token for
  # weeks — caught by the STI-423 daily drift run, but nothing prevented them.
  # This gate makes the top-down chain mechanical: every property in tokens.css
  # must name a token DESIGN.md really declares, and DESIGN.md must lint clean.
  token-drift-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run token drift gate
        run: ./scripts/ci/token-drift-gate.sh

      # STI-516: the step above walks one edge of a three-node chain —
      #   DESIGN.md -> tokens.css -> component CSS
      # — and the second edge had no gate at all, which is how six selectors in
      # STI-515 shipped `font-weight: 600` with CI green. This step walks
      # component CSS and fails on a weight outside DESIGN.md's `typography:`
      # ramp, with the six known ones held in a ratchet baseline that shrinks as
      # STI-515 lands. No Node and no secrets: it reads only DESIGN.md,
      # tokens.css and app/.
      - name: Run component weight ramp gate
        run: ./scripts/ci/component-weight-ramp-gate.sh

  # STI-517 (split out of STI-428): the storefront must stay on the live Shopify
  # data path. Three agents' AGENTS.md files asserted `mock = true` for weeks
  # after f3ac83d (STI-319) had set it to false, and the only thing standing
  # between that stale sentence and a broken live data path was a comment in
  # nuxt.config.ts — which is precisely what a well-meaning agent argues past.
  # This gate makes the invariant mechanical. It needs no Node and no secrets:
  # it reads only the configured value, never the Storefront token.
  storefront-mock-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run storefront mock gate
        run: ./scripts/ci/storefront-mock-gate.sh

  # STI-542: the build was not reproducible, so "CI is green" did not mean "the
  # artifact is the one that was reviewed". Two builds of 9c55c363 published
  # different font files: the brand face was resolved through @nuxt/fonts with
  # provider 'google' and through a remote @import, both of which read the
  # network at BUILD time, and Nuxt's buildId was a fresh randomUUID() per
  # build. Nothing the live site served identified which commit was deployed, so
  # every "verified live" claim in this company rested on an inference.
  #
  # The fix pins the font (integrity-hashed in pnpm-lock.yaml) and derives
  # buildId from the commit. This gate is what stops either regressing: it
  # builds the SAME commit twice on one runner and fails when the artifact
  # digests differ. One job, no new infrastructure, no store secrets beyond the
  # token the Build step already uses.
  #
  # GITHUB_SHA is pinned for both builds so the two runs are genuinely builds
  # of one commit: without it the resolver falls back to `git rev-parse HEAD`,
  # which is stable within a job anyway, but pinning removes the question.
  #
  # WHAT "IDENTICAL" MEANS HERE, precisely: `pnpm build:hash` normalises away
  # build CLOCK and ITERATION-ORDER noise before hashing — nitro.json's `date`,
  # the `timestamp` in Nuxt's build manifest, every `mtime` in Nitro's asset
  # manifest, and the two minified object literals whose key order Vite does
  # not fix. Measured on 6fa7f888 over three consecutive local builds, those were
  # the ONLY differences: all 49 files under dist/_nuxt/ were byte-identical
  # every time. The rules are enumerated in scripts/artifact-normalise.mjs and
  # none of them drop a content byte — `pnpm build:hash` still moves when any
  # hashed file's bytes move, which is checked by the gate's own negative
  # control below. So this compares CONTENT, not build metadata.
  build-determinism-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # STI-542: the determinism gate below is only as trustworthy as the
      # normaliser it compares with, and the failure mode of an over-eager
      # normaliser is a GREEN gate on two different artifacts. These tests assert
      # both directions: build metadata normalises away, content does not. Pure
      # unit test, no store credentials, no build.
      - name: Artifact normaliser tests
        run: pnpm build:hash:test

      - name: Build twice and compare artifact digests
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          first=""
          for attempt in 1 2; do
            # Clear the caches that make a rebuild reuse the first build's
            # answers. .nuxt holds the Vite/nuxt cache, and the build marker is
            # regenerated by prebuild on every run.
            rm -rf .nuxt dist

            echo "::group::Build ${attempt} of 2"
            pnpm build
            echo "::endgroup::"

            digest="$(pnpm build:hash | awk '{print $1}')"
            if [ -z "${digest}" ]; then
              echo "Could not read an artifact digest from build ${attempt}."
              exit 1
            fi
            echo "build ${attempt} digest: ${digest}"

            if [ -z "${first}" ]; then
              first="${digest}"

              # Negative control, run once against a real build. A determinism
              # gate that cannot detect a change is not a gate, and the only way
              # to know this one still bites is to change a byte and watch the
              # digest move. This costs nothing and turns "the normaliser is not
              # too eager" from a claim in a comment into a fact the run log
              # states. It must run here, after build 1, so there is a real
              # artifact to perturb.
              cp dist/__build.json /tmp/build-marker.bak
              printf '\n' >> dist/__build.json
              perturbed="$(pnpm build:hash | awk '{print $1}')"
              cp /tmp/build-marker.bak dist/__build.json
              if [ "${perturbed}" = "${first}" ]; then
                echo "::error::The digest did not move after mutating a hashed file."
                echo "scripts/artifact-normalise.mjs is excluding too much — the"
                echo "gate would pass on two genuinely different artifacts."
                exit 1
              fi
              echo "Negative control passed: mutating a hashed file moved the digest."

              # Keep build 1 aside so build 2 can be diffed against it. The
              # digest alone says only that SOMETHING moved; the compare names
              # the file, which is the difference between a five-minute fix
              # and a rebuild-everything-to-find-out afternoon. The loop only
              # clears `.nuxt` and `dist`, so this survives into attempt 2.
              rm -rf .dist-build-1
              cp -a dist .dist-build-1

            elif [ "${first}" != "${digest}" ]; then
              echo "::error::Build is not reproducible."
              echo "build 1: ${first}"
              echo "build 2: ${digest}"
              echo "Two builds of ${GITHUB_SHA} produced different content."
              echo "Causes already eliminated in STI-542, listed so nobody"
              echo "re-checks them: a build-time network fetch (a remote font"
              echo "@import, or a nuxt.config fonts.families entry with provider"
              echo "'google') and a per-build random buildId. Neither is the"
              echo "cause any more; both were fixed before this gate was green."
              echo ""
              echo "If the differing file is a minified chunk under"
              echo "_worker.js/chunks/ and the two versions are the same length,"
              echo "the cause is the minifier assigning different local names to"
              echo "the same bindings. That is STI-573: esbuild picks names from"
              echo "a character-frequency table over its input, and the wall-clock"
              echo "bytes embedded in Nitro's asset manifest perturb that table."
              echo "The fix belongs in scripts/artifact-normalise.mjs, and the"
              echo "rule must state why the field is not content. Do not widen"
              echo "the gate instead."
              echo ""
              echo "If the difference is only in build metadata, the fix belongs"
              echo "in scripts/artifact-normalise.mjs, and the rule must state why"
              echo "the field is not content. Do not widen the gate instead."
              echo ""
              echo "Which files differ (normalised the same way the digest is):"
              # Deliberately not `exit 1` on the compare's own status: the
              # digest already failed, and a compare that cannot read a
              # directory must not replace the real error with a louder one.
              node scripts/artifact-compare.mjs .dist-build-1 dist || true
              exit 1
            fi
          done

          echo "Two builds of ${GITHUB_SHA} are content-identical: ${first}"

      - name: Assert the build marker names this commit
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # The marker is what turns "a build of main is live" into "commit X
          # is live". If it is missing or names a different commit the site is
          # un-attributable again, which is the gap this whole issue is about.
          actual="$(node -e "process.stdout.write(String(require('./dist/__build.json').commit || ''))")"
          if [ "${actual}" != "${GITHUB_SHA}" ]; then
            echo "::error::dist/__build.json names '${actual}', expected '${GITHUB_SHA}'."
            exit 1
          fi
          echo "dist/__build.json names ${actual}"
