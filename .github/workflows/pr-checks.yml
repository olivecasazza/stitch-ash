name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # STI-395: @nuxtjs/shopify generates the StorefrontAPI codegen types
        # (IMAGE_FRAGMENT, useStorefrontData, #shopify/storefront, ...) during
        # `nuxt prepare`. It skips setup entirely when the storefront token is
        # absent — "[shopify] Skipping setup: config not provided or invalid" —
        # so the types are never written and every consumer of them fails
        # typecheck. The Build step below already receives this token; the
        # typecheck step did not, which is why this check has been red for
        # every storefront PR since PR #33.
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  internal-copy-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run internal-copy gate
        run: ./scripts/ci/no-internal-copy-in-storefront.sh