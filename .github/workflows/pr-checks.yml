name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # STI-395: @nuxtjs/shopify generates the StorefrontAPI codegen types
        # (IMAGE_FRAGMENT, useStorefrontData, #shopify/storefront, ...) during
        # `nuxt prepare`. It skips setup entirely when the storefront token is
        # absent — "[shopify] Skipping setup: config not provided or invalid" —
        # so the types are never written and every consumer of them fails
        # typecheck. The Build step below already receives this token; the
        # typecheck step did not, which is why this check has been red for
        # every storefront PR since PR #33.
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
        run: pnpm typecheck

      # STI-432: `catalog:plan` reported 5 phantom `update variant` actions
      # because the diff resolved remote option values by the hardcoded name
      # "Option1"/"Title" and missed the `Size` option on sku-001. A false plan
      # is exactly what the operator approval gate exists to catch, so the diff
      # itself is now under test. Pure unit test, no store credentials needed.
      - name: Catalog diff tests
        run: pnpm catalog:test

      - name: Build
        run: pnpm build

  # STI-538: product status is declared twice — catalog/products/*.yaml says
  # ACTIVE, nixlab nix/tofu/shopify/terranix.nix says "draft". The live store is
  # ACTIVE on all three SKUs, and the terranix resources use update_method=PUT,
  # so `nix run .#deploy-shopify` would de-list all three in one apply. The two
  # files live in different repos, so nothing points an editor at the conflict.
  # This gate makes it visible; see docs/decisions/2026-09-28-catalog-source-of-truth.md
  # for the single-owner decision. No store credentials are read here.
  catalog-status-ownership-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # STI-557: the gate compares status AND inventory_policy. The first
      # version compared status only, so the cheapest operator edit — terranix
      # status "draft" -> "active" — turned it green while
      # `inventory_policy = "deny"` stood in the same block. On the live store
      # that would block checkout on all 7 variants, every one of which is at
      # or below zero inventory. This suite pins that exact fixture so the
      # false green cannot come back, and pins that a missing nixlab tree is
      # reported SKIPPED rather than passed. Needs no Node and no secrets.
      - name: Test catalog status ownership gate
        run: ./scripts/ci/catalog-status-ownership-gate.test.sh

      - name: Run catalog status ownership gate
        run: ./scripts/ci/catalog-status-ownership-gate.sh

  internal-copy-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run internal-copy gate
        run: ./scripts/ci/no-internal-copy-in-storefront.sh

  # STI-446: 30 custom properties sat in tokens.css with no DESIGN.md token for
  # weeks — caught by the STI-423 daily drift run, but nothing prevented them.
  # This gate makes the top-down chain mechanical: every property in tokens.css
  # must name a token DESIGN.md really declares, and DESIGN.md must lint clean.
  token-drift-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run token drift gate
        run: ./scripts/ci/token-drift-gate.sh

      # STI-516: the step above walks one edge of a three-node chain —
      #   DESIGN.md -> tokens.css -> component CSS
      # — and the second edge had no gate at all, which is how six selectors in
      # STI-515 shipped `font-weight: 600` with CI green. This step walks
      # component CSS and fails on a weight outside DESIGN.md's `typography:`
      # ramp, with the six known ones held in a ratchet baseline that shrinks as
      # STI-515 lands. No Node and no secrets: it reads only DESIGN.md,
      # tokens.css and app/.
      - name: Run component weight ramp gate
        run: ./scripts/ci/component-weight-ramp-gate.sh

  # STI-517 (split out of STI-428): the storefront must stay on the live Shopify
  # data path. Three agents' AGENTS.md files asserted `mock = true` for weeks
  # after f3ac83d (STI-319) had set it to false, and the only thing standing
  # between that stale sentence and a broken live data path was a comment in
  # nuxt.config.ts — which is precisely what a well-meaning agent argues past.
  # This gate makes the invariant mechanical. It needs no Node and no secrets:
  # it reads only the configured value, never the Storefront token.
  storefront-mock-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run storefront mock gate
        run: ./scripts/ci/storefront-mock-gate.sh