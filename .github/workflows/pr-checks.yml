name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        # STI-395: @nuxtjs/shopify generates the StorefrontAPI codegen types
        # (IMAGE_FRAGMENT, useStorefrontData, #shopify/storefront, ...) during
        # `nuxt prepare`. It skips setup entirely when the storefront token is
        # absent — "[shopify] Skipping setup: config not provided or invalid" —
        # so the types are never written and every consumer of them fails
        # typecheck. The Build step below already receives this token; the
        # typecheck step did not, which is why this check has been red for
        # every storefront PR since PR #33.
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
        run: pnpm typecheck

      # STI-432: `catalog:plan` reported 5 phantom `update variant` actions
      # because the diff resolved remote option values by the hardcoded name
      # "Option1"/"Title" and missed the `Size` option on sku-001. A false plan
      # is exactly what the operator approval gate exists to catch, so the diff
      # itself is now under test. Pure unit test, no store credentials needed.
      - name: Catalog diff tests
        run: pnpm catalog:test

      - name: Build
        run: pnpm build

  # STI-601: the deploy freshness gate was an inline `run:` block whose only
  # signal was run-level `conclusion`. A run whose `deploy` job was SKIPPED
  # still reports `success`, so one green no-op satisfied the gate forever and
  # every later cron firing cited that no-op — the backstop could stop healing
  # drift while staying green indefinitely. The predicate now lives in
  # scripts/ci/deploy-freshness-gate.sh and filters on the `deploy` JOB's
  # conclusion.
  #
  # This job runs the self-test, not the gate: the gate answers "is live behind
  # main?", which is a live-environment question and would fail every PR by
  # design. The self-test is the part that can regress silently. It is offline
  # (stubbed gh/git reading checked-in-shape fixtures), needs no token and no
  # Node, and it goes RED against the pre-STI-601 predicate — 15 of 19 assertions
  # fail — which is the only evidence that it tests the right thing.
  # See docs/STI-601-freshness-gate.md.
  deploy-freshness-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Self-test the deploy freshness gate
        run: ./scripts/ci/deploy-freshness-gate.test.sh

      # STI-620: this job also self-tests the dispatch dedup gate, which sits on
      # the path that publishes the site. It shares this job rather than getting
      # one of its own because it has the identical shape — offline, stubbed gh,
      # no token, no Node, sub-second — and because the two gates are a matched
      # pair: STI-601 corrected the deploy side and STI-620 stopped the trigger
      # side over-firing. Both are publish-path guards, so both must be red
      # before review rather than discovered on a live merge.
      #
      # The two suites are also mutually asserting. The dedup suite asserts that
      # deploy.yml's freshness clause is still scoped to `schedule`, so this
      # issue cannot be "fixed" later by widening that gate and reintroducing
      # STI-601 — the failure mode this issue's own description warns against.
      - name: Self-test the deploy dispatch dedup gate
        run: ./scripts/ci/deploy-dispatch-dedup.test.sh

  # STI-538: product status is declared twice — catalog/products/*.yaml says
  # ACTIVE, nixlab nix/tofu/shopify/terranix.nix says "draft". The live store is
  # ACTIVE on all three SKUs, and the terranix resources use update_method=PUT,
  # so `nix run .#deploy-shopify` would de-list all three in one apply. The two
  # files live in different repos, so nothing points an editor at the conflict.
  # This gate makes it visible; see docs/decisions/2026-09-28-catalog-source-of-truth.md
  # for the single-owner decision. No store credentials are read here.
  catalog-status-ownership-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # STI-557: the gate compares status AND inventory_policy. The first
      # version compared status only, so the cheapest operator edit — terranix
      # status "draft" -> "active" — turned it green while
      # `inventory_policy = "deny"` stood in the same block. On the live store
      # that would block checkout on all 7 variants, every one of which is at
      # or below zero inventory. This suite pins that exact fixture so the
      # false green cannot come back, and pins that a missing nixlab tree is
      # reported SKIPPED rather than passed. Needs no Node and no secrets.
      #
      # STI-569: the suite used to point at an agent-host nixlab path that does
      # not exist on a runner, so this job was red on every PR and the red
      # meant nothing. The conflicting terranix is now checked in at
      # scripts/ci/fixtures/catalog-status-ownership/nixlab/, so the assertion
      # is reproducible on a fresh clone.
      - name: Test catalog status ownership gate
        run: ./scripts/ci/catalog-status-ownership-gate.test.sh

      # This step alone is still cross-repo blind on a runner: it checks out
      # only this repo, finds no nixlab tree, reports SKIPPED and exits 0.
      # Closing that needs a second checkout — tracked as STI-531/STI-561,
      # deliberately not folded into STI-569.
      - name: Run catalog status ownership gate
        run: ./scripts/ci/catalog-status-ownership-gate.sh

      # STI-552: the step above cannot be made cross-repo aware in CI, because
      # nixlab is a private repo and this workflow has no access to it. So the
      # conflict stays invisible to CI by construction, and the gate that is
      # supposed to hold it is never actually evaluated in the place where a
      # green result would be believed.
      #
      # The guard below is the part that does not need nixlab: it checks the
      # GENERATED config.tf.json -- the bytes a `tofu apply` would send to
      # Shopify -- against this repo's catalog, and refuses a plan that would
      # de-list a catalog-ACTIVE product or deny checkout on a catalog-CONTINUE
      # one. It runs its own fixture suite here. The suite pins the status-only
      # "fix" that made the v1 ownership gate go green while
      # inventory_policy = "deny" stood untouched, and pins that an unreadable
      # or empty config is a failure rather than a pass.
      #
      # WHAT THIS IS NOT: this job does not protect the deploy. Nothing in
      # nixlab's apps/deploy-shopify.nix calls deploy-shopify-preflight.sh --
      # verified 2026-10-01 at blob 390cd96, which runs `tofu plan`, prompts
      # (or skips the prompt under --auto-approve), and applies. So the guard
      # is correct and tested here, but unwired at the point of harm. Treating
      # this green job as "deploy-shopify is safe" would be a false claim;
      # the wiring is operator-side nixlab work, same as STI-531.
      #
      # STI-561 also showed the committed terranix fixture has drifted from the
      # real private file it stands in for. That drift currently misses every
      # field the guard reads, so the verdicts hold. Nothing enforces that,
      # which is why scripts/ci/terranix-projection-pin.sh pins the real
      # file's (handle, status, inventory_policy) projection for a run that can
      # fetch it. It is deliberately NOT a step here: a job that cannot read the
      # file it pins is green by construction, which is the defect STI-561
      # documents.
      - name: Test deploy-shopify preflight guard
        run: ./scripts/ci/deploy-shopify-preflight.test.sh

  internal-copy-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run internal-copy gate
        run: ./scripts/ci/no-internal-copy-in-storefront.sh

  # STI-415: the built stylesheet shipped five non-zero border-radius literals
  # (.25rem, 3.40282e+38px, inherit, .3125rem, .375rem) even though every
  # rounded-* call site in app/ was already rounded-none. They come from
  # node_modules — @nuxt/ui's own component styles and @tailwindcss/typography —
  # so no source-only grep can see them, and both STI-402 DoD checks could go
  # green with a violating stylesheet live. This gate reads the build artifact.
  # --strict-ratchet also fails if a pinned tolerance stops occurring, so the
  # tolerated set can only shrink.
  radius-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
        run: pnpm build

      - name: Self-test the radius gate
        run: ./scripts/ci/built-css-radius-gate.test.sh

      - name: Run built-CSS radius gate
        run: ./scripts/ci/built-css-radius-gate.sh --strict-ratchet

  # STI-446: 30 custom properties sat in tokens.css with no DESIGN.md token for
  # weeks — caught by the STI-423 daily drift run, but nothing prevented them.
  # This gate makes the top-down chain mechanical: every property in tokens.css
  # must name a token DESIGN.md really declares, and DESIGN.md must lint clean.
  token-drift-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run token drift gate
        run: ./scripts/ci/token-drift-gate.sh

      # STI-516: the step above walks one edge of a three-node chain —
      #   DESIGN.md -> tokens.css -> component CSS
      # — and the second edge had no gate at all, which is how six selectors in
      # STI-515 shipped `font-weight: 600` with CI green. This step walks
      # component CSS and fails on a weight outside DESIGN.md's `typography:`
      # ramp, with the six known ones held in a ratchet baseline that shrinks as
      # STI-515 lands. No Node and no secrets: it reads only DESIGN.md,
      # tokens.css and app/.
      - name: Run component weight ramp gate
        run: ./scripts/ci/component-weight-ramp-gate.sh

  # STI-517 (split out of STI-428): the storefront must stay on the live Shopify
  # data path. Three agents' AGENTS.md files asserted `mock = true` for weeks
  # after f3ac83d (STI-319) had set it to false, and the only thing standing
  # between that stale sentence and a broken live data path was a comment in
  # nuxt.config.ts — which is precisely what a well-meaning agent argues past.
  # This gate makes the invariant mechanical. It needs no Node and no secrets:
  # it reads only the configured value, never the Storefront token.
  storefront-mock-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run storefront mock gate
        run: ./scripts/ci/storefront-mock-gate.sh

  # STI-628: the storefront's public access token is served to every anonymous
  # visitor inside `config.public`. That is correct — a Storefront *public* token
  # is a browser credential by design, and using the published value against the
  # Admin API returns 401 (see the decision record below). But nothing held the
  # property. @nuxtjs/shopify reads admin.accessToken, privateAccessToken and
  # customers.clientSecret in the same runtimeConfig family, one line away, and in
  # the served HTML a private token looks byte-identical to today's page — so a
  # one-line refactor could publish a real credential with no gate noticing.
  #
  # This gate is that check. Static and offline: it reads no env var, no secret,
  # and needs no store. The self-test runs first because a gate that cannot detect
  # the violation is not a gate — it asserts ten private-publication shapes are
  # rejected and five legitimate ones accepted, so this job cannot go green on a
  # gate that has stopped working.
  public-runtime-config-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Self-test the public runtime config gate
        run: ./scripts/ci/public-runtime-config-gate.test.sh

      - name: Run public runtime config gate
        run: ./scripts/ci/public-runtime-config-gate.sh

  # STI-669: PR #207 (f29e7d8, "fix(storefront): facts in the expander, wordmark
  # +cart header, no footer, cart on the token ramp") carried three deletions
  # that had nothing to do with its stated scope through to main with CI green
  # the whole way:
  #
  #   app/pages/account.vue                     165 -----
  #   app/utils/customer-account.ts              75 -----
  #   src/catalog/account-order-history.test.ts 145 -----
  #
  # That silently removed two shipped, verified-live features (STI-633 and
  # STI-652 were both closed on live-verified claims that this commit falsified).
  # Nobody wrote bad code; no check asked what the diff removed.
  #
  # This gate is that check. It keys off the real deleted paths from
  # `git diff --diff-filter=D --name-only` against the merge base and never
  # parses the PR title or body, so a description that does not match the diff
  # cannot authorise anything. A deletion under app/pages/, app/utils/,
  # app/composables/ or src/catalog/ must be declared in
  # scripts/ci/deletion-scope-manifest.txt with an issue id and a named
  # sign-off; a deleted test must additionally name a replacement test that
  # survives at HEAD. The committed manifest declares nothing, so the default is
  # closed rather than open.
  #
  # fetch-depth: 0 is required, not cosmetic: the gate diffs against the merge
  # base with origin/main, and actions/checkout's default shallow clone of depth
  # 1 has no merge base, which would make the gate refuse to run.
  deletion-scope-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A gate that cannot detect the violation is not a gate. The self-test
      # asserts the failure modes AND runs the gate against the real f29e7d8
      # diff, so this job cannot go green on a gate that has stopped working.
      - name: Self-test the deletion scope gate
        run: ./scripts/ci/deletion-scope-gate.test.sh

      - name: Run deletion scope gate
        run: ./scripts/ci/deletion-scope-gate.sh

  # STI-542: the build was not reproducible, so "CI is green" did not mean "the
  # artifact is the one that was reviewed". Two builds of 9c55c363 published
  # different font files: the brand face was resolved through @nuxt/fonts with
  # provider 'google' and through a remote @import, both of which read the
  # network at BUILD time, and Nuxt's buildId was a fresh randomUUID() per
  # build. Nothing the live site served identified which commit was deployed, so
  # every "verified live" claim in this company rested on an inference.
  #
  # The fix pins the font (integrity-hashed in pnpm-lock.yaml) and derives
  # buildId from the commit. This gate is what stops either regressing: it
  # builds the SAME commit twice on one runner and fails when the artifact
  # digests differ. One job, no new infrastructure, no store secrets beyond the
  # token the Build step already uses.
  #
  # GITHUB_SHA is pinned for both builds so the two runs are genuinely builds
  # of one commit: without it the resolver falls back to `git rev-parse HEAD`,
  # which is stable within a job anyway, but pinning removes the question.
  #
  # WHAT "IDENTICAL" MEANS HERE, precisely: `pnpm build:hash` normalises away
  # build CLOCK and ITERATION-ORDER noise before hashing — nitro.json's `date`,
  # the `timestamp` in Nuxt's build manifest, every `mtime` in Nitro's asset
  # manifest, and the two minified object literals whose key order Vite does
  # not fix. Measured on 6fa7f888 over three consecutive local builds, those were
  # the ONLY differences: all 49 files under dist/_nuxt/ were byte-identical
  # every time. The rules are enumerated in scripts/artifact-normalise.mjs and
  # none of them drop a content byte — `pnpm build:hash` still moves when any
  # hashed file's bytes move, which is checked by the gate's own negative
  # control below. So this compares CONTENT, not build metadata.
  build-determinism-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # STI-542: the determinism gate below is only as trustworthy as the
      # normaliser it compares with, and the failure mode of an over-eager
      # normaliser is a GREEN gate on two different artifacts. These tests assert
      # both directions: build metadata normalises away, content does not. Pure
      # unit test, no store credentials, no build.
      - name: Artifact normaliser tests
        run: pnpm build:hash:test

      - name: Build twice and compare artifact digests
        env:
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          first=""
          for attempt in 1 2; do
            # Clear the caches that make a rebuild reuse the first build's
            # answers. .nuxt holds the Vite/nuxt cache, and the build marker is
            # regenerated by prebuild on every run.
            rm -rf .nuxt dist

            echo "::group::Build ${attempt} of 2"
            pnpm build
            echo "::endgroup::"

            digest="$(pnpm build:hash | awk '{print $1}')"
            if [ -z "${digest}" ]; then
              echo "Could not read an artifact digest from build ${attempt}."
              exit 1
            fi
            echo "build ${attempt} digest: ${digest}"

            if [ -z "${first}" ]; then
              first="${digest}"

              # Negative control, run once against a real build. A determinism
              # gate that cannot detect a change is not a gate, and the only way
              # to know this one still bites is to change a byte and watch the
              # digest move. This costs nothing and turns "the normaliser is not
              # too eager" from a claim in a comment into a fact the run log
              # states. It must run here, after build 1, so there is a real
              # artifact to perturb.
              #
              # TWO controls, because the normaliser has two independent
              # surfaces and one control cannot cover both. STI-573 added
              # `canonicaliseMangledNames`, which rewrites generated minified
              # chunks. The original control only perturbed dist/__build.json —
              # a JSON file that never reaches that rule — so it would still have
              # passed with the chunk rule replaced by a stub that discards the
              # file outright, which is exactly the "green on two genuinely
              # different builds" failure this control exists to prevent. Measured
              # on 17effae by substituting a rule that returns Buffer.from(''):
              # the __build.json control still reported "passed" while every
              # content change inside a real chunk became invisible.
              #
              # Control 2 is the one that covers the new rule, so it perturbs a
              # real generated chunk. A rename inside a chunk must NOT move the
              # digest (that is the rule working), so the mutation is a content
              # change — a trailing comment, which is content by the rule's own
              # definition and is proven to move the digest in both directions by
              # scripts/artifact-normalise.test.mjs.
              cp dist/__build.json /tmp/build-marker.bak
              printf '\n' >> dist/__build.json
              perturbed="$(pnpm build:hash | awk '{print $1}')"
              cp /tmp/build-marker.bak dist/__build.json
              if [ "${perturbed}" = "${first}" ]; then
                echo "::error::The digest did not move after mutating a hashed file."
                echo "scripts/artifact-normalise.mjs is excluding too much — the"
                echo "gate would pass on two genuinely different artifacts."
                exit 1
              fi
              echo "Negative control 1 passed: mutating a hashed file moved the digest."

              chunk="$(find dist/_worker.js/chunks -name '*.mjs' -type f 2>/dev/null | head -1 || true)"
              if [ -z "${chunk}" ]; then
                echo "::error::No generated chunk found under dist/_worker.js/chunks."
                echo "Cannot run the chunk negative control, so the gate is"
                echo "unproven against an over-eager chunk rule. Failing rather"
                echo "than reporting a green run that tested nothing."
                exit 1
              fi
              echo "Negative control 2 targets: ${chunk}"
              cp "${chunk}" /tmp/chunk.bak
              printf '\n//sti573-negative-control\n' >> "${chunk}"
              chunk_perturbed="$(pnpm build:hash | awk '{print $1}')"
              cp /tmp/chunk.bak "${chunk}"
              if [ "${chunk_perturbed}" = "${first}" ]; then
                echo "::error::The digest did not move after mutating a generated"
                echo "chunk (${chunk}). canonicaliseMangledNames in"
                echo "scripts/artifact-normalise.mjs is normalising away CONTENT,"
                echo "not just generated names, and the gate would pass on two"
                echo "genuinely different builds."
                exit 1
              fi
              echo "Negative control 2 passed: mutating a generated chunk moved the digest."

              # Keep build 1 aside so build 2 can be diffed against it. The
              # digest alone says only that SOMETHING moved; the compare names
              # the file, which is the difference between a five-minute fix
              # and a rebuild-everything-to-find-out afternoon. The loop only
              # clears `.nuxt` and `dist`, so this survives into attempt 2.
              rm -rf .dist-build-1
              cp -a dist .dist-build-1

            elif [ "${first}" != "${digest}" ]; then
              echo "::error::Build is not reproducible."
              echo "build 1: ${first}"
              echo "build 2: ${digest}"
              echo "Two builds of ${GITHUB_SHA} produced different content."
              echo "Causes already eliminated in STI-542, listed so nobody"
              echo "re-checks them: a build-time network fetch (a remote font"
              echo "@import, or a nuxt.config fonts.families entry with provider"
              echo "'google') and a per-build random buildId. Neither is the"
              echo "cause any more; both were fixed before this gate was green."
              echo ""
              echo "If the differing file is a minified chunk under"
              echo "_worker.js/chunks/ and the two versions are the same length,"
              echo "the cause is the minifier assigning different local names to"
              echo "the same bindings. That is STI-573: esbuild picks names from"
              echo "a character-frequency table over its input, and the wall-clock"
              echo "bytes embedded in Nitro's asset manifest perturb that table."
              echo "The fix belongs in scripts/artifact-normalise.mjs, and the"
              echo "rule must state why the field is not content. Do not widen"
              echo "the gate instead."
              echo ""
              echo "If the difference is only in build metadata, the fix belongs"
              echo "in scripts/artifact-normalise.mjs, and the rule must state why"
              echo "the field is not content. Do not widen the gate instead."
              echo ""
              echo "Which files differ (normalised the same way the digest is):"
              # Deliberately not `exit 1` on the compare's own status: the
              # digest already failed, and a compare that cannot read a
              # directory must not replace the real error with a louder one.
              #
              # --dump writes both sides' normalised bytes to .artifact-compare/
              # so the failure is diagnosable from the log instead of from a
              # rebuild nobody can reproduce. It is useless without the upload
              # step below: a runner's workspace is discarded when the job ends,
              # so without that step these bytes would be written and lost.
              node scripts/artifact-compare.mjs .dist-build-1 dist --dump || true
              exit 1
            fi
          done

          echo "Two builds of ${GITHUB_SHA} are content-identical: ${first}"

      - name: Assert the build marker names this commit
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # The marker is what turns "a build of main is live" into "commit X
          # is live". If it is missing or names a different commit the site is
          # un-attributable again, which is the gap this whole issue is about.
          actual="$(node -e "process.stdout.write(String(require('./dist/__build.json').commit || ''))")"
          if [ "${actual}" != "${GITHUB_SHA}" ]; then
            echo "::error::dist/__build.json names '${actual}', expected '${GITHUB_SHA}'."
            exit 1
          fi
          echo "dist/__build.json names ${actual}"

      # STI-542: the `--dump` above writes the differing bytes to
      # .artifact-compare/ on the runner, and a runner's workspace is deleted
      # when the job ends. Without this step a determinism failure names the
      # files that differ and then throws the evidence away, which is the same
      # "rebuild it yourself and hope" loop this gate was built to end. The
      # negative controls prove the digest still bites; this proves the failure
      # is actually diagnosable.
      #
      # include-hidden-files is REQUIRED, not cosmetic. `.artifact-compare`
      # starts with a dot, and upload-artifact@v4 skips hidden files by default
      # — so with the default this step logs
      #   "No files were found with the provided path: .artifact-compare/"
      # and uploads nothing. That is exactly what the first run of this change
      # did (run 36612852876, job 109558386804), while the compare one line
      # earlier reported the dump was written. A gate that says it saved the
      # bytes and did not is worse than one that never claimed to.
      #
      # if-no-files-found stays `warn`: a green run has no dump directory and
      # must not fail on that, but a failing run that dumped nothing must stay
      # visible in the log rather than erroring here.
      - name: Upload differing artifact bytes when the build is not reproducible
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: artifact-compare-dump
          path: .artifact-compare/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
