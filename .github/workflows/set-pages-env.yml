name: Set Pages env var

on:
  workflow_dispatch:
    inputs:
      key:
        description: "Env var name (e.g. PAPERCLIP_ADMIN_API_KEY)"
        required: true
        type: string
      value:
        description: "Env var value (treated as secret — use masked input)"
        required: true
        type: string
      environment:
        description: "Pages environment (production | preview)"
        required: true
        type: choice
        default: production
        options:
          - production
          - preview

jobs:
  set-env:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set Pages env var via CF API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KEY: ${{ inputs.key }}
          VALUE: ${{ inputs.value }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          echo "::group::Setting $KEY on stitch-ash-web ($ENVIRONMENT)"
          # Cloudflare Pages env vars live on the project, not on a deployment.
          # We PATCH the project and supply a single env var under
          # deployment_configs.{environment}.env_vars. CF encrypts at rest.
          # Pages:Edit scope is required; the GH-side CLOUDFLARE_API_TOKEN has it.
          BODY=$(jq -nc \
            --arg k "$KEY" \
            --arg v "$VALUE" \
            --arg env "$ENVIRONMENT" \
            '{(("deployment_configs") + "." + $env): {env_vars: {($k): {type: "secret_text", value: $v}}}}')
          URL="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/stitch-ash-web"
          echo "PATCH $URL"
          echo "body: $BODY"
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$BODY" \
            "$URL")
          echo "HTTP: $HTTP"
          cat /tmp/resp.json | jq .
          if [ "$HTTP" -ne 200 ]; then
            echo "::error::Failed to set env var (HTTP $HTTP)"
            exit 1
          fi
          echo "::endgroup::"
          echo "Set ${KEY} on stitch-ash-web (${ENVIRONMENT}) — verify by sending a test admin bug report to https://stitch-ash-web.pages.dev/api/bug-report"
